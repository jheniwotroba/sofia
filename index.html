<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja Sof - Pulseiras e Colares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffafc;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffc1cc;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .intro {
            text-align: center;
            padding: 20px;
        }

        .intro p {
            font-size: 1.2em;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .galeria img {
            width: 250px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        footer {
            background-color: #ffe4ec;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Loja Sof</h1>
        <p>Pulseiras & Colares para todas as idades</p>
    </header>

    <div class="intro">
        <p>Localizada em Piên - PR</p>
        <p>Atendemos bebês, crianças e adultos com carinho e estilo 💖</p>
    </div>

    <div class="galeria">
        <img src="https://via.placeholder.com/250x250?text=Pulseira+1" alt="Pulseira">
        <img src="https://via.placeholder.com/250x250?text=Colar+1" alt="Colar">
        <img src="https://via.placeholder.com/250x250?text=Pulseira+e+Colar" alt="Conjunto">
    </div>

    <footer>
        <p>&copy; 2025 Loja Sof - Todos os direitos reservados</p>
    </footer>

</body>
</html>
